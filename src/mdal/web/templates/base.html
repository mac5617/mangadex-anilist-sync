<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MangaDex → AniList sync{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/settings">Settings</a>
    </nav>
  </header>
  <main>
    {% if message %}<p class="notice ok" role="status">{{ message }}</p>{% endif %}
    {% if error %}<p class="notice err" role="alert">{{ error }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
