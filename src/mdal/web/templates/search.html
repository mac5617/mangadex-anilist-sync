{% extends "base.html" %}
{% block title %}Search{% endblock %}
{% block content %}
<div class="page-head"><h1>Search</h1></div>
<form class="search-big" action="/search" method="get" role="search">
  <label for="search-page-q" class="visually-hidden">Search series</label>
  <input id="search-page-q" type="search" name="q" value="{{ q }}" placeholder="Any title: romaji, English or Japanese" autocomplete="off" autofocus
    hx-get="/search/results" hx-trigger="input changed delay:250ms, search" hx-target="#search-results" hx-swap="outerHTML">
  <button>Search</button>
</form>
{% include "_search_results.html" %}
{% endblock %}
