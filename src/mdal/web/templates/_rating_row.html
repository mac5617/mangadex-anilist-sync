{%- set kind, ident = key.split(":", 1) -%}
<tr id="rating-{{ kind }}-{{ ident }}">
{% if r %}
  <td><a class="series-cell" href="{{ href }}">{% if cover %}<img class="thumb" src="{{ cover }}" alt="" width="38" height="54" loading="lazy" referrerpolicy="no-referrer"
    onerror="this.onerror=null;this.removeAttribute('src');this.classList.add('broken')">{% else %}<span class="thumb placeholder" aria-hidden="true"></span>{% endif %}
    <span class="series-text"><span class="md-title">{{ r.title }}</span></span></a></td>
  <td>
    <select aria-label="Rating for {{ r.title }}" name="verdict" hx-post="/series/{{ kind }}/{{ ident }}/rate" hx-trigger="change"
      hx-target="#rating-{{ kind }}-{{ ident }}" hx-swap="outerHTML">
      {% for v, label in verdicts.items() %}<option value="{{ v }}"{% if v == r.verdict %} selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
  </td>
  <td class="muted">{% if r.source == "ask" %}Ask{% elif r.source == "hide" %}Marked Not interested{% else %}Series page{% endif %}</td>
  <td class="muted">{{ r.created_at | when }}</td>
  <td><button type="button" class="link-button small" hx-post="/series/{{ kind }}/{{ ident }}/rate" hx-vals='{"verdict": "clear"}'
    hx-target="#rating-{{ kind }}-{{ ident }}" hx-swap="outerHTML">Remove</button></td>
{% else %}
  <td colspan="5" class="muted">Removed.
    {% if was %}<button type="button" class="link-button small" hx-post="/series/{{ kind }}/{{ ident }}/rate"
      hx-vals='{{ {"verdict": was.verdict, "source": was.source, "saved_at": was.created_at} | tojson | forceescape }}'
      hx-target="#rating-{{ kind }}-{{ ident }}" hx-swap="outerHTML">Undo</button>{% endif %}</td>
{% endif %}
</tr>
