<div class="figures" id="diff-stats"{% if oob %} hx-swap-oob="true"{% endif %}>
  <div class="figure"><span class="figure-value">{{ counts.write | num }}</span><span class="figure-label">Updates</span></div>
  <div class="figure"><span class="figure-value">{{ counts.add | num }}</span><span class="figure-label">New entries</span></div>
  <div class="figure{% if counts.flag %} tone-warn{% endif %}"><span class="figure-value">{{ counts.flag | num }}</span><span class="figure-label">Flagged</span></div>
  <div class="figure"><span class="figure-value">{{ counts.skip | num }}</span><span class="figure-label">Skipped</span></div>
  <div class="figure"><span class="figure-value">{{ counts.complete | num }}</span><span class="figure-label">Completions</span></div>
</div>
