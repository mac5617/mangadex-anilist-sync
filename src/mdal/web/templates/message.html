{% extends "base.html" %}
{% block title %}{{ "Error" if error else "Done" }}{% endblock %}
{% block content %}
<div class="row">
  {% if restore %}<form method="post" action="/sync/{{ restore }}/restore"><button>Undo: restore sync #{{ restore }}</button></form>{% endif %}
  {% if back %}<a class="button secondary" href="{{ back }}">{{ back_label or "Back" }}</a>{% endif %}
</div>
{% endblock %}
